# .github/workflows/heroku-deploy.yml
# Tự động deploy 4 service lên Heroku mỗi khi push lên nhánh main.
#
# Cần tạo 2 secret trong GitHub repo (Settings > Secrets and variables > Actions):
#   HEROKU_API_KEY : lấy bằng lệnh  heroku authorizations:create -d "GitHub Actions"
#   HEROKU_PREFIX  : tiền tố tên app, ví dụ  n23dccn173
#
# Ghi chú: code mẫu dùng action akhileshns/heroku-deploy, action này cần Heroku CLI
# có sẵn trên runner nhưng image ubuntu-latest hiện không còn cài sẵn. Ở đây deploy
# trực tiếp bằng git push tới git.heroku.com với API key nên không phụ thuộc CLI.
# Mỗi service nằm trong 1 thư mục con -> dùng "git subtree split" để đẩy riêng thư mục đó.

name: Deploy to Heroku

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy user-service
        run: |
          git push --force "https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_PREFIX }}-user-service.git" \
            "$(git subtree split --prefix user-service HEAD):refs/heads/main"

  deploy-product-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy product-service
        run: |
          git push --force "https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_PREFIX }}-product-service.git" \
            "$(git subtree split --prefix product-service HEAD):refs/heads/main"

  deploy-order-service:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy order-service
        run: |
          git push --force "https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_PREFIX }}-order-service.git" \
            "$(git subtree split --prefix order-service HEAD):refs/heads/main"

  deploy-api-gateway:
    runs-on: ubuntu-latest
    needs: [deploy-user-service, deploy-product-service, deploy-order-service]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy api-gateway
        run: |
          git push --force "https://heroku:${{ secrets.HEROKU_API_KEY }}@git.heroku.com/${{ secrets.HEROKU_PREFIX }}-api-gateway.git" \
            "$(git subtree split --prefix api-gateway HEAD):refs/heads/main"
